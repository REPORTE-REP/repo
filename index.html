<style>
:root{
  --bg:#14171A; --panel:#1B1F24; --panel-2:#242A31; --panel-3:#2D343C;
  --border:#333B44; --border-soft:#272E36;
  --text:#EDEFF1; --text-dim:#9AA5B1; --text-faint:#657081;
  --accent:#FF7A29; --accent-dim:rgba(255,122,41,.20);
  --brand-gradient:linear-gradient(135deg,#F0402B 0%,#FF7A1A 55%,#FFC93C 100%);
  --wifi:#E5484D; --pon:#30A46C; --lan:#F1A10D; --danado:#22C3E6;
  --radius:10px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F3F4F6; --panel:#FFFFFF; --panel-2:#F7F8F9; --panel-3:#EEF0F2;
    --border:#DCE0E5; --border-soft:#E9ECEF;
    --text:#171A1E; --text-dim:#565F6B; --text-faint:#8A93A0;
    --accent:#E85D04; --accent-dim:rgba(232,93,4,.14);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif; color:var(--text); -webkit-font-smoothing:antialiased;}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;}
#app{display:flex; min-height:100vh;}

.sidebar{width:220px; flex:0 0 220px; background:var(--panel); border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px 8px;}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex:0 0 34px; font-family:"IBM Plex Mono"; font-weight:600; font-size:15px; color:#fff;}
.brand-mark-img{width:38px; height:38px; flex:0 0 38px; object-fit:contain; border-radius:9px;}
.brand-footer-logo{padding:10px 4px 4px; margin:14px 0 4px; display:flex; align-items:center; justify-content:center;}
.brand-footer-logo img{width:100%; height:auto; display:block; max-width:150px; opacity:.92;}
.brand-text{line-height:1.15;}
.brand-text b{display:block; font-size:14.5px; font-weight:600;}
.brand-text span{display:block; font-size:11px; color:var(--text-faint);}
.nav{display:flex; flex-direction:column; gap:2px; margin-top:6px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; color:var(--text-dim); font-size:13.5px; cursor:pointer; border:none; background:none; text-align:left; width:100%; font-family:inherit; transition:background .12s,color .12s;}
.nav-item:hover{background:var(--panel-2); color:var(--text);}
.nav-item.active{background:var(--accent-dim); color:var(--accent);}
.nav-icon{width:17px; height:17px; flex:0 0 17px; opacity:.9;}
.sidebar-foot{margin-top:auto; padding:10px 8px; font-size:10.5px; color:var(--text-faint); line-height:1.5;}
.status-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px;}
.status-dot.on{background:var(--pon);} .status-dot.off{background:var(--wifi);} .status-dot.mid{background:var(--lan);}

.main{flex:1; min-width:0; padding:28px 34px 60px;}
.main.wide{max-width:none;} .main.narrow{max-width:1180px;}
.view{display:none;} .view.active{display:block;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h1{font-size:21px; font-weight:600; margin:0 0 4px;}
.page-head p{margin:0; color:var(--text-dim); font-size:13px; max-width:560px;}
.head-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

.card{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px;}
.card-title{font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin:0 0 14px;}

.btn{display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:8px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; transition:all .12s;}
.btn:hover{background:var(--panel-3);}
.btn.primary{background:var(--brand-gradient); border-color:transparent; color:#241000; font-weight:600;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{color:var(--wifi); border-color:transparent;}
.btn.danger:hover{background:rgba(229,72,77,.12);}
.btn.small{padding:6px 11px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

input,select,textarea{font-family:inherit; background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:8px 10px; font-size:13.5px; outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label{font-size:11.5px; color:var(--text-faint); font-weight:500; text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:5px;}
.field{margin-bottom:12px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);}
td{padding:8px 10px; border-bottom:1px solid var(--border-soft);}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right; font-family:"IBM Plex Mono"; font-variant-numeric:tabular-nums;}
tr.total-row td{font-weight:600; background:var(--panel-2);}

.badge{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;}
.badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
.badge.b-wifi{color:var(--wifi); background:rgba(229,72,77,.12);}
.badge.b-pon{color:var(--pon); background:rgba(48,166,108,.12);}
.badge.b-lan{color:var(--lan); background:rgba(241,161,13,.12);}
.badge.b-danado{color:var(--danado); background:rgba(34,195,230,.12);}
.badge.b-ok{color:var(--text-faint); background:var(--panel-2);}

.previa-table td.brand-cell{color:var(--text-faint); font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
.previa-table input.qty{width:64px; text-align:center; padding:6px; font-family:"IBM Plex Mono";}
.previa-table tr.brand-huawei td.model-cell{border-left:2px solid var(--wifi);}
.previa-table tr.brand-zte td.model-cell{border-left:2px solid var(--accent);}
.previa-table td.model-cell{padding-left:8px; font-weight:500;}

.color-toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 14px; background:var(--panel-2); border:1px solid var(--border-soft); border-radius:9px; margin-bottom:12px; position:sticky; top:0; z-index:20;}
.swatch{display:flex; align-items:center; gap:7px; padding:7px 12px; border-radius:7px; border:1px solid var(--border); background:var(--panel); cursor:pointer; font-size:12.5px; font-weight:600; color:var(--text-dim); font-family:inherit;}
.swatch:hover{background:var(--panel-3);}
.swatch .dot{width:11px; height:11px; border-radius:3px;}
.swatch[data-st="PON"] .dot{background:var(--pon);}
.swatch[data-st="WIFI"] .dot{background:var(--wifi);}
.swatch[data-st="LAN"] .dot{background:var(--lan);}
.swatch[data-st="DAÑADO"] .dot{background:var(--danado);}
.swatch[data-st="OK"] .dot{background:transparent; border:1.5px solid var(--text-faint);}
.toolbar-sep{width:1px; align-self:stretch; background:var(--border);}
.toolbar-hint{color:var(--text-faint); font-size:11.5px; margin-left:auto;}
.save-status{font-size:11.5px; color:var(--text-faint); display:flex; align-items:center; gap:6px; white-space:nowrap;}

.sheet-scroll{overflow-x:auto; border:1px solid var(--border-soft); border-radius:9px; background:var(--panel);}
.sheet{border-collapse:separate; border-spacing:0; font-size:12.5px;}
.sheet th, .sheet td{border-right:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); padding:0;}
.sheet thead th{background:var(--panel-2); padding:6px 8px; text-align:left; white-space:nowrap; position:sticky; top:0; z-index:5;}
.sheet thead th.col-head{min-width:172px;}
.sheet thead th.pos-head{min-width:44px; position:sticky; left:0; z-index:6; background:var(--panel-2); text-align:center;}
.sheet tbody th.pos-cell{position:sticky; left:0; z-index:4; background:var(--panel-2); text-align:center; font-family:"IBM Plex Mono"; color:var(--text-faint); font-size:11.5px; min-width:44px;}
.col-head-inner{display:flex; align-items:center; gap:6px;}
.col-head-inner select{flex:1; min-width:0; padding:5px 6px; font-size:11.5px;}
.col-head-inner .col-label{font-family:"IBM Plex Mono"; font-size:11px; color:var(--text-faint); min-width:38px;}
.col-del{background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px 5px; border-radius:5px; line-height:1;}
.col-del:hover{color:var(--wifi); background:rgba(229,72,77,.12);}
.cell-input{width:100%; min-width:172px; border:none; border-radius:0; background:transparent; color:var(--text); font-family:"IBM Plex Mono"; font-size:12.5px; padding:7px 8px; outline:none;}
.cell-input:focus{box-shadow:inset 0 0 0 2px var(--accent); background:var(--panel-2);}
.cell-wrap{position:relative;}
.cell-wrap.st-PON .cell-input{background:rgba(48,166,108,.22); color:#0B2A18;}
.cell-wrap.st-WIFI .cell-input{background:rgba(229,72,77,.22); color:#3A0A0B;}
.cell-wrap.st-LAN .cell-input{background:rgba(241,161,13,.24); color:#2E1E00;}
.cell-wrap.st-DAÑADO .cell-input{background:rgba(34,195,230,.22); color:#00232A;}
@media (prefers-color-scheme: light){
  .cell-wrap.st-PON .cell-input{color:#0B2A18;} .cell-wrap.st-WIFI .cell-input{color:#3A0A0B;}
  .cell-wrap.st-LAN .cell-input{color:#2E1E00;} .cell-wrap.st-DAÑADO .cell-input{color:#00232A;}
}
.cell-wrap.selected{box-shadow:inset 0 0 0 2px var(--accent); z-index:2; position:relative;}
.add-col-cell{min-width:54px; text-align:center; vertical-align:middle;}
.add-col-btn{width:34px; height:34px; border-radius:8px; border:1px dashed var(--border); background:none; color:var(--text-faint); font-size:18px; cursor:pointer; line-height:1;}
.add-col-btn:hover{color:var(--accent); border-color:var(--accent);}

.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
.kpi{background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 18px;}
.kpi .val{font-family:"IBM Plex Mono"; font-size:24px; font-weight:600; line-height:1.1;}
.kpi .lbl{color:var(--text-faint); font-size:11.5px; margin-top:6px; text-transform:uppercase; letter-spacing:.03em;}
.kpi .sub{color:var(--text-dim); font-size:11.5px; margin-top:3px;}
.chart-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media (max-width:900px){ .chart-grid{grid-template-columns:1fr;} }
.chart-box{height:280px; position:relative;} .chart-box.small{height:240px;}

.empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13px;}
.empty-state b{color:var(--text-dim); display:block; margin-bottom:4px; font-size:14px;}
.pill-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
.pill{padding:5px 11px; border-radius:20px; font-size:12px; border:1px solid var(--border); background:var(--panel-2); cursor:pointer; color:var(--text-dim);}
.pill.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.search-result{display:flex; align-items:center; gap:14px; padding:11px 4px; border-bottom:1px solid var(--border-soft);}
.search-result .serial{font-family:"IBM Plex Mono"; font-size:13px; min-width:170px;}
.search-result .meta{color:var(--text-dim); font-size:12px; flex:1;}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--panel-3); border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:9px; font-size:13px; box-shadow:0 6px 22px rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:999;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
.toast.err{border-color:var(--wifi); color:var(--wifi);}
.hint{font-size:12px; color:var(--text-faint); margin-top:4px;}
.divider{height:1px; background:var(--border-soft); margin:18px 0;}
/* ---------- Mobile layout ---------- */
@media (max-width: 860px){
  #app{display:block;}
  .sidebar{
    position:static; width:auto; height:auto; padding:0; overflow:visible;
    display:block; border-right:none;
  }
  .sidebar-foot{display:none;}
  .brand{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:var(--panel); border-bottom:1px solid var(--border-soft);
    padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px; margin:0;
  }
  .brand-mark-img{width:30px; height:30px; flex:0 0 30px;}
  .brand-text b{font-size:13.5px;} .brand-text span{font-size:10px;}
  .nav{
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    flex-direction:row; gap:0; background:var(--panel);
    border-top:1px solid var(--border-soft);
    padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));
  }
  .nav-item{flex-direction:column; gap:3px; flex:1; padding:6px 2px; border-radius:8px; font-size:10px; text-align:center;}
  .nav-icon{width:19px; height:19px;}
  .main{padding:calc(66px + env(safe-area-inset-top,0px)) 14px calc(72px + env(safe-area-inset-bottom,0px)); max-width:none;}
  .main.wide, .main.narrow{max-width:none;}
  .page-head{flex-direction:column; align-items:flex-start;}
  .page-head h1{font-size:18px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .chart-grid{grid-template-columns:1fr;}
  .color-toolbar{position:sticky; top:calc(60px + env(safe-area-inset-top,0px)); z-index:20;}
  .toolbar-hint{display:none;}
}
</style>
</head>

<div id="app">
  <nav class="sidebar">
    <div class="brand"><img class="brand-mark-img" src="" id="brand-icon" alt="Control ONT"><div class="brand-text"><b>Control ONT</b><span>Registro diario</span></div></div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">
      <div class="brand-footer-logo"><img id="brand-footer-img" src="" alt="Netlife"></div>
      <div id="db-status"><span class="status-dot mid"></span>Conectando…</div>
      <div style="margin-top:4px;" id="date-today"></div>
    </div>
  </nav>
  <main class="main narrow"><div id="view-root"></div></main>
</div>
<div class="toast" id="toast"></div>

function toast(msg,isErr){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.toggle("err",!!isErr); t.classList.add("show"); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove("show"),2600); }

/* ===================== CONNECTION STATUS ===================== */
function describeError(e){
  if(!e) return "Error desconocido";
  const parts = [e.message, e.details, e.hint, e.code].filter(Boolean);
  return parts.length ? parts.join(" · ") : (typeof e==="string" ? e : JSON.stringify(e));
}
async function checkConnection(){
  const el = document.getElementById("db-status");
  try{
    const { error } = await sb.from("previa_entries").select("id",{count:"exact",head:true});
    if(error) throw error;
    el.innerHTML = `<span class="status-dot on"></span>Conectado a Supabase`;
  }catch(e){
    console.error("Supabase connection error",e);
    const msg = describeError(e);
    el.innerHTML = `<span class="status-dot off"></span>Sin conexión<div style="color:var(--wifi); font-size:10px; margin-top:3px; word-break:break-word;">${escapeHtml(msg)}</div>`;
    toast("No se pudo conectar: "+msg, true);
  }
}

/* ===================== DATA LAYER: PREVIA ===================== */
async function loadPrevia(dateISO){
  const { data, error } = await sb.from("previa_entries").select("*").eq("fecha",dateISO);
  if(error){ console.error(error); toast("Error al cargar el día: "+describeError(error),true); return {date:dateISO, counts:{}}; }
  const counts = {};
  (data||[]).forEach(r=>{ counts[r.modelo]=counts[r.modelo]||{}; counts[r.modelo][r.categoria]=r.cantidad; });
  return {date:dateISO, counts};
}
async function savePrevia(dateISO, counts){
  try{
    await sb.from("previa_entries").delete().eq("fecha",dateISO);
    const rows = [];
    Object.entries(counts).forEach(([modelo,row])=>{
      const brand = MODEL_MAP[modelo]?.brand || "";
      Object.entries(row).forEach(([categoria,cantidad])=>{
        rows.push({fecha:dateISO, marca:brand, modelo, categoria, cantidad, updated_at:new Date().toISOString()});
      });
    });
    if(rows.length) await sb.from("previa_entries").insert(rows);
    return true;
  }catch(e){ console.error(e); toast("No se pudo guardar: "+describeError(e),true); return false; }
}
/* Supabase/PostgREST caps each request at ~1000 rows by default, regardless
   of .limit(). This fetches in pages until everything has been retrieved. */
async function fetchAllPages(buildQuery){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    const { data, error } = await buildQuery(from, from+pageSize-1);
    if(error){ console.error(error); toast("Error al cargar datos: "+describeError(error), true); break; }
    if(!data || data.length===0) break;
    all = all.concat(data);
    if(data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}
async function listAllPrevia(){
  const data = await fetchAllPages((from,to)=> sb.from("previa_entries").select("*").order("fecha",{ascending:false}).range(from,to));
  const byDate = {};
  data.forEach(r=>{
    byDate[r.fecha] = byDate[r.fecha] || {date:r.fecha, counts:{}};
    byDate[r.fecha].counts[r.modelo] = byDate[r.fecha].counts[r.modelo] || {};
    byDate[r.fecha].counts[r.modelo][r.categoria] = r.cantidad;
  });
  return Object.values(byDate);
}

/* ===================== DATA LAYER: TECNICA ===================== */
function emptyCells(){ return Array.from({length:TRAY_SIZE},(_,i)=>({pos:i+1, serial:"", estado:"OK"})); }
function newColumn(seq){ return {id:"c"+seq+"_"+Date.now().toString(36), seq, modelo:"", cells:emptyCells()}; }

function rowsToColumns(rows){
  const bySeq = {};
  rows.forEach(r=>{
    bySeq[r.tanda] = bySeq[r.tanda] || {id:"c"+r.tanda, seq:r.tanda, modelo:r.modelo||"", cells:emptyCells()};
    if(r.modelo) bySeq[r.tanda].modelo = r.modelo;
    const idx = r.posicion-1;
    if(idx>=0 && idx<TRAY_SIZE) bySeq[r.tanda].cells[idx] = {pos:r.posicion, serial:r.serie||"", estado:r.estado||"OK"};
  });
  return Object.values(bySeq).sort((a,b)=>a.seq-b.seq);
}

async function loadTecnicaDay(dateISO){
  const data = await fetchAllPages((from,to)=> sb.from("tecnica_slots").select("*").eq("fecha",dateISO).order("tanda").order("posicion").range(from,to));
  let columns = rowsToColumns(data);
  if(columns.length===0) columns = [newColumn(1)];
  return {date:dateISO, columns};
}
async function saveTecnicaColumns(dateISO, columns){
  const rows = [];
  columns.forEach(col=>{
    const brand = MODEL_MAP[col.modelo]?.brand || "";
    col.cells.forEach(cell=>{
      rows.push({
        fecha:dateISO, tanda:col.seq, posicion:cell.pos,
        serie:cell.serial||"", marca:brand, modelo:col.modelo||"",
        estado:cell.estado||"OK", updated_at:new Date().toISOString()
      });
    });
  });
  if(rows.length===0) return true;
  try{
    const { error } = await sb.from("tecnica_slots").upsert(rows, {onConflict:"fecha,tanda,posicion"});
    if(error) throw error;
    return true;
  }catch(e){ console.error(e); return false; }
}
async function deleteTanda(dateISO, seq){
  try{ await sb.from("tecnica_slots").delete().eq("fecha",dateISO).eq("tanda",seq); }catch(e){ console.error(e); }
}
async function listAllTecnicaDays(){
  const data = await fetchAllPages((from,to)=> sb.from("tecnica_slots").select("*").order("fecha",{ascending:false}).range(from,to));
  const byDate = {};
  data.forEach(r=>{ byDate[r.fecha] = byDate[r.fecha] || []; byDate[r.fecha].push(r); });
  return Object.entries(byDate).map(([date,rows])=>({date, columns:rowsToColumns(rows)}));
}

let tecnicaSelDate = todayStr();
let tecnicaDay = null;
let selectedCells = new Set();   // "colId:row"
let selAnchor = null;            // {colId,row} base for shift-click / shift-drag
let dragStartCell = null;        // {colId,row} where a mouse drag began
let dragBaseSelection = null;    // Set snapshot for ctrl+drag (additive)
let undoStack = [];
let redoStack = [];
let editSnapshotPending = false; // true right after a cell gains focus, until first keystroke
let tecSaveTimer = null;
let tecSaveState = "idle";

function scheduleTecSave(){
  tecSaveState = "pending"; updateSaveStatus();
  clearTimeout(tecSaveTimer);
  tecSaveTimer = setTimeout(flushTecnicaSave, 900);
}
async function flushTecnicaSave(){
  if(!tecnicaDay || tecSaveState==="idle") return;
  clearTimeout(tecSaveTimer);
  tecSaveState = "saving"; updateSaveStatus();
  const ok = await saveTecnicaColumns(tecnicaDay.date, tecnicaDay.columns);
  tecSaveState = ok ? "saved" : "error"; updateSaveStatus();
  if(!ok) toast("No se pudo guardar en la base",true);
  setTimeout(()=>{ if(tecSaveState==="saved"){ tecSaveState="idle"; updateSaveStatus(); }},2500);
}
function updateSaveStatus(){
  const el = document.getElementById("tec-save-status");
  if(!el) return;
  const map = {idle:"Todo guardado", pending:"Cambios sin guardar…", saving:"Guardando…", saved:"✓ Guardado", error:"⚠ Error al guardar"};
  el.textContent = map[tecSaveState];
}

/* ---- undo/redo ---- */
function pushUndo(){
  if(!tecnicaDay) return;
  undoStack.push(JSON.stringify(tecnicaDay.columns));
  if(undoStack.length>50) undoStack.shift();
  redoStack = [];
}
function undo(){
  if(undoStack.length===0){ toast("Nada que deshacer"); return; }
  redoStack.push(JSON.stringify(tecnicaDay.columns));
  tecnicaDay.columns = JSON.parse(undoStack.pop());
  selectedCells = new Set(); selAnchor=null;
  scheduleTecSave(); renderSheet();
  toast("Deshecho");
}
function redo(){
  if(redoStack.length===0){ toast("Nada que rehacer"); return; }
  undoStack.push(JSON.stringify(tecnicaDay.columns));
  tecnicaDay.columns = JSON.parse(redoStack.pop());
  selectedCells = new Set(); selAnchor=null;
  scheduleTecSave(); renderSheet();
  toast("Rehecho");
}

/* ---- selection helpers ---- */
function cellKey(colId,row){ return colId+":"+row; }
function colIndex(colId){ return tecnicaDay.columns.findIndex(c=>c.id===colId); }
function selectSingle(colId,row){ selectedCells = new Set([cellKey(colId,row)]); selAnchor = {colId,row}; }
function toggleCell(colId,row){
  const k = cellKey(colId,row);
  if(selectedCells.has(k)) selectedCells.delete(k); else selectedCells.add(k);
  selAnchor = {colId,row};
}
function rectKeys(colIdA,rowA,colIdB,rowB){
  const ci1=colIndex(colIdA), ci2=colIndex(colIdB);
  const cLo=Math.min(ci1,ci2), cHi=Math.max(ci1,ci2);
  const rLo=Math.min(rowA,rowB), rHi=Math.max(rowA,rowB);
  const keys=[];
  for(let ci=cLo; ci<=cHi; ci++){
    const col = tecnicaDay.columns[ci]; if(!col) continue;
    for(let r=rLo; r<=rHi; r++) keys.push(cellKey(col.id,r));
  }
  return keys;
}
function selectRectFromAnchorTo(colId,row){
  if(!selAnchor) return selectSingle(colId,row);
  selectedCells = new Set(rectKeys(selAnchor.colId, selAnchor.row, colId, row));
}
function isCellSelected(colId,row){ return selectedCells.has(cellKey(colId,row)); }
function selectionBounds(){
  let cIdxs=[], rows=[];
  selectedCells.forEach(k=>{ const idx=k.lastIndexOf(":"); const colId=k.slice(0,idx), row=Number(k.slice(idx+1)); cIdxs.push(colIndex(colId)); rows.push(row); });
  return {cLo:Math.min(...cIdxs), cHi:Math.max(...cIdxs), rLo:Math.min(...rows), rHi:Math.max(...rows)};
}
function highlightSelection(){
  document.querySelectorAll("#tec-sheet .cell-wrap").forEach(w=>w.classList.remove("selected"));
  selectedCells.forEach(k=>{
    const idx=k.lastIndexOf(":"); const colId=k.slice(0,idx), row=k.slice(idx+1);
    const inp = document.querySelector(`#tec-sheet .cell-input[data-col="${CSS.escape(colId)}"][data-row="${row}"]`);
    if(inp) inp.closest(".cell-wrap").classList.add("selected");
  });
}
function focusCell(colId,row){
  const inp = document.querySelector(`#tec-sheet .cell-input[data-col="${CSS.escape(colId)}"][data-row="${row}"]`);
  if(inp){ inp.focus(); inp.select(); }
}
function applyStateToSelection(state){
  if(selectedCells.size===0){ toast("Selecciona una o más series primero"); return; }
  pushUndo();
  selectedCells.forEach(k=>{
    const idx=k.lastIndexOf(":"); const colId=k.slice(0,idx), row=Number(k.slice(idx+1));
    const col = tecnicaDay.columns.find(c=>c.id===colId);
    if(col) col.cells[row].estado = state;
  });
  scheduleTecSave();
  renderSheet();
}

/* ---- clipboard ---- */
async function copySelection(){
  if(selectedCells.size===0) return;
  const {cLo,cHi,rLo,rHi} = selectionBounds();
  const lines = [];
  for(let r=rLo; r<=rHi; r++){
    const parts=[];
    for(let ci=cLo; ci<=cHi; ci++){
      const col = tecnicaDay.columns[ci];
      parts.push(col ? (col.cells[r].serial||"") : "");
    }
    lines.push(parts.join("\t"));
  }
  try{ await navigator.clipboard.writeText(lines.join("\n")); toast("Copiado ("+selectedCells.size+(selectedCells.size===1?" serie)":" series)")); }
  catch(e){ toast("No se pudo copiar al portapapeles",true); }
}
async function cutSelection(){
  if(selectedCells.size===0) return;
  await copySelection();
  pushUndo();
  selectedCells.forEach(k=>{
    const idx=k.lastIndexOf(":"); const colId=k.slice(0,idx), row=Number(k.slice(idx+1));
    const col = tecnicaDay.columns.find(c=>c.id===colId);
    if(col){ col.cells[row].serial=""; col.cells[row].estado="OK"; }
  });
  scheduleTecSave(); renderSheet();
  toast("Cortado");
}

async function renderTecnicaView(root){
  tecnicaDay = await loadTecnicaDay(tecnicaSelDate);
  selectedCells = new Set(); selAnchor=null;
  undoStack = []; redoStack = [];
  tecSaveState = "idle";

  root.innerHTML = `
    <div class="page-head">
      <div><h1>Fase técnica · hoja de escaneo</h1><p>Escanea del 1 al 24 y el cursor avanza solo. Selecciona una o varias series y aplica el color del daño — se cuenta y se guarda automáticamente.</p></div>
      <div class="head-actions"><input type="date" id="tecnica-date" value="${tecnicaSelDate}"></div>
    </div>
    <div class="color-toolbar">
      ${TEC_STATES.map(st=>`<button type="button" class="swatch" data-st="${st}"><span class="dot"></span>${stLabel(st)}</button>`).join("")}
      <div class="toolbar-sep"></div>
      <span class="save-status"><span id="tec-save-status">Todo guardado</span></span>

  document.getElementById("tecnica-date").addEventListener("change", async (e)=>{

function renderSheet(){
  const table = document.getElementById("tec-sheet");
  if(!table) return;
  const cols = tecnicaDay.columns;

  const thead = `<thead><tr>
    <th class="pos-head">#</th>
    ${cols.map(col=>`<th class="col-head">
      <div class="col-head-inner">
        <span class="col-label">T${col.seq}</span>
        <select data-col="${col.id}" class="col-model">
          <option value="">Modelo…</option>
          ${MODELS.map(m=>`<option value="${m.code}" ${m.code===col.modelo?"selected":""}>${m.code}</option>`).join("")}
        </select>
        ${cols.length>1?`<button type="button" class="col-del" data-col="${col.id}" title="Eliminar tanda">×</button>`:""}
      </div>
    </th>`).join("")}
    <th class="add-col-cell"><button type="button" class="add-col-btn" id="add-col-btn" title="Nueva tanda">+</button></th>
  </tr></thead>`;

  let tbody = "<tbody>";
  for(let row=0; row<TRAY_SIZE; row++){
    tbody += `<tr><th class="pos-cell">${row+1}</th>`;
    cols.forEach(col=>{
      const cell = col.cells[row];
      const st = cell.estado && cell.estado!=="OK" ? cell.estado : "";
      const isSel = isCellSelected(col.id,row);
      tbody += `<td><div class="cell-wrap ${st?"st-"+st:""} ${isSel?"selected":""}">
        <input class="cell-input" type="text" spellcheck="false" autocomplete="off"
          data-col="${col.id}" data-row="${row}" value="${escapeHtml(cell.serial)}" placeholder="">
      </div></td>`;
    });
    tbody += `<td></td></tr>`;
  }
  tbody += "</tbody>";
  table.innerHTML = thead+tbody;

  table.querySelectorAll(".col-model").forEach(sel=>sel.addEventListener("change",()=>{
    const col = cols.find(c=>c.id===sel.dataset.col);
    pushUndo();
    col.modelo = sel.value; scheduleTecSave();
  }));
  table.querySelectorAll(".col-del").forEach(btn=>btn.addEventListener("click", async ()=>{
    const col = cols.find(c=>c.id===btn.dataset.col);
    if(!confirm("¿Eliminar la tanda "+col.seq+"? Se perderán sus datos.")) return;
    pushUndo();
    tecnicaDay.columns = cols.filter(c=>c.id!==col.id);
    selectedCells=new Set(); selAnchor=null; renderSheet();
    await deleteTanda(tecnicaDay.date, col.seq);
    toast("Tanda "+col.seq+" eliminada");
  }));
  const addBtn = document.getElementById("add-col-btn");
  if(addBtn) addBtn.addEventListener("click", ()=>addColumnAndFocus());

  table.querySelectorAll(".cell-input").forEach(inp=>{
    const colId = inp.dataset.col, row = Number(inp.dataset.row);

    inp.addEventListener("mousedown", (e)=>{
      dragStartCell = {colId,row};
      if(e.ctrlKey || e.metaKey){
        dragBaseSelection = new Set(selectedCells);
        toggleCell(colId,row);
      } else if(e.shiftKey){
        selectRectFromAnchorTo(colId,row);
        dragBaseSelection = null;
      } else {
        selectSingle(colId,row);
        dragBaseSelection = null;
      }
      highlightSelection();
    });
    inp.addEventListener("mouseenter", (e)=>{
      if(!dragStartCell || e.buttons!==1) return;
      if(dragBaseSelection){
        selectedCells = new Set([...dragBaseSelection, ...rectKeys(dragStartCell.colId,dragStartCell.row,colId,row)]);
      } else {
        selAnchor = dragStartCell;
        selectRectFromAnchorTo(colId,row);
      }
      highlightSelection();
    });
    inp.addEventListener("focus", ()=>{
      editSnapshotPending = true;
      if(!selectedCells.has(cellKey(colId,row)) || selectedCells.size!==1){
        selectSingle(colId,row); highlightSelection();
      }
    });
    inp.addEventListener("input", ()=>{
      if(editSnapshotPending){ pushUndo(); editSnapshotPending=false; }
      const col = cols.find(c=>c.id===colId);
      col.cells[row].serial = inp.value;
      scheduleTecSave();
    });
    inp.addEventListener("keydown", (e)=>{
      const ctrl = e.ctrlKey || e.metaKey;
      if(ctrl && e.key.toLowerCase()==="c"){ e.preventDefault(); copySelection(); return; }
      if(ctrl && e.key.toLowerCase()==="x"){ e.preventDefault(); cutSelection(); return; }
      if(ctrl && e.key.toLowerCase()==="z" && !e.shiftKey){ e.preventDefault(); undo(); return; }
      if(ctrl && (e.key.toLowerCase()==="y" || (e.shiftKey && e.key.toLowerCase()==="z"))){ e.preventDefault(); redo(); return; }
      if(e.key==="Enter" || e.key==="ArrowDown"){
        e.preventDefault();
        if(row < TRAY_SIZE-1){ focusCell(colId, row+1); } else { addColumnAndFocus(); }
      } else if(e.key==="ArrowUp"){
        e.preventDefault(); if(row>0) focusCell(colId,row-1);
      } else if(e.key==="Tab"){
        setTimeout(()=>{
          const active = document.activeElement;
          if(active && active.classList.contains("cell-input")){
            selectSingle(active.dataset.col, Number(active.dataset.row)); highlightSelection();
          }
        },0);
      } else if(e.altKey && ["1","2","3","4","0"].includes(e.key)){
        e.preventDefault();
        applyStateToSelection({"1":"PON","2":"WIFI","3":"LAN","4":"DAÑADO","0":"OK"}[e.key]);
      }
    });
    inp.addEventListener("paste", (e)=>{
      const text = (e.clipboardData || window.clipboardData).getData("text");
      if(!text) return;
      e.preventDefault();
      const rowsRaw = text.replace(/\r/g,"").split("\n");
      while(rowsRaw.length && rowsRaw[rowsRaw.length-1]==="") rowsRaw.pop();
      if(rowsRaw.length===0) return;
      const grid = rowsRaw.map(r=>r.split("\t"));
      const singleColumn = grid.every(r=>r.length<=1);
      pushUndo();
      if(singleColumn){
        // classic scanner-list paste: fills down, overflows into new tandas
        let curColIdx = cols.findIndex(c=>c.id===colId);
        let curRow = row;
        grid.forEach(r=>{
          const line = (r[0]||"").trim();
          if(line==="") return;
          if(curRow>=TRAY_SIZE){
            curColIdx++;
            if(!tecnicaDay.columns[curColIdx]) tecnicaDay.columns.push(newColumn(Math.max(...tecnicaDay.columns.map(c=>c.seq))+1));
            curRow=0;
          }
          tecnicaDay.columns[curColIdx].cells[curRow].serial = line;
          curRow++;
        });
      } else {
        // block paste (e.g. copied from this same sheet): fills rows x columns from the focused cell
        const startColIdx = cols.findIndex(c=>c.id===colId);
        const maxCols = Math.max(...grid.map(r=>r.length));
        while(tecnicaDay.columns.length < startColIdx+maxCols){
          tecnicaDay.columns.push(newColumn(Math.max(...tecnicaDay.columns.map(c=>c.seq))+1));
        }
        grid.forEach((rowVals,ri)=>{
          const targetRow = row+ri;
          if(targetRow>=TRAY_SIZE) return;
          rowVals.forEach((val,ci)=>{
            const col = tecnicaDay.columns[startColIdx+ci];
            if(col) col.cells[targetRow].serial = val.trim();
          });
        });
      }
      scheduleTecSave(); renderSheet();
      toast("Pegado");
    });
  });
}
function addColumnAndFocus(){
  const nextSeq = Math.max(...tecnicaDay.columns.map(c=>c.seq))+1;
  const nc = newColumn(nextSeq);
  tecnicaDay.columns.push(nc);
  renderSheet();
  focusCell(nc.id,0);
}

/* ===================== VIEW: DASHBOARD ===================== */
let dashMonth = null; let dashDay = null; let chartRefs = [];
function aggregatePrevia(previaDocs){
  const byCat={}; PREVIA_CATS.forEach(c=>byCat[c]=0);
  const byModel={};
  previaDocs.forEach(d=>Object.entries(d.counts||{}).forEach(([model,row])=>{
    byModel[model]=byModel[model]||{};
    Object.entries(row).forEach(([cat,q])=>{ byCat[cat]=(byCat[cat]||0)+q; byModel[model][cat]=(byModel[model][cat]||0)+q; });
  }));
  const total = Object.values(byCat).reduce((a,b)=>a+b,0);
  return {byCat,byModel,total};
}
function aggregateTecnica(dayDocs){
  const byCat={}; TEC_CATS.forEach(c=>byCat[c]=0);
  const byModel={}; let probed=0, damaged=0;
  dayDocs.forEach(day=>(day.columns||[]).forEach(col=>col.cells.forEach(cell=>{
    if(!cell.serial) return; probed++;
    if(cell.estado && cell.estado!=="OK"){
      damaged++; byCat[cell.estado]=(byCat[cell.estado]||0)+1;
      const model=col.modelo||"—"; byModel[model]=byModel[model]||{};
      byModel[model][cell.estado]=(byModel[model][cell.estado]||0)+1;
    }
  })));
  const total = Object.values(byCat).reduce((a,b)=>a+b,0);
  return {byCat,byModel,total,probed,damaged};
}
function renderDayDetail(dayRow, previaAll){
  const el = document.getElementById("dash-day-detail");
  if(!el) return;
  const date = dayRow.date;
  const pv = aggregatePrevia(previaAll.filter(d=>d.date===date));
  const tc = dayRow.tc || aggregateTecnica([]);
  const pct = tc.probed ? (tc.damaged/tc.probed*100) : 0;
  if(pv.total===0 && tc.probed===0){
    el.innerHTML = `<div class="empty-state"><b>${fmtDateHuman(date)}</b>No hay registros para este día.</div>`;
    return;
  }
  el.innerHTML = `
    <p style="margin:0 0 12px; color:var(--text-dim); font-size:13px; text-transform:capitalize;">${fmtDateHuman(date)}</p>
    <div class="kpi-row">
      <div class="kpi"><div class="val mono">${pv.total}</div><div class="lbl">Daños fase previa</div></div>
      <div class="kpi"><div class="val mono">${tc.probed}</div><div class="lbl">Probados en técnica</div></div>
      <div class="kpi"><div class="val mono" style="${tc.damaged?'color:var(--wifi)':''}">${tc.damaged}</div><div class="lbl">Dañados en técnica</div><div class="sub">${pct.toFixed(1)}% de lo probado</div></div>
    </div>
    <div class="chart-grid">
      <div><p class="card-title">Previa por categoría</p><table><tbody>
        ${PREVIA_CATS.map(c=>`<tr><td>${c}</td><td class="num">${pv.byCat[c]||0}</td><td class="num">${pv.total?((pv.byCat[c]||0)/pv.total*100).toFixed(1):"0.0"}%</td></tr>`).join("")}
        <tr class="total-row"><td>Total</td><td class="num">${pv.total}</td><td class="num">100%</td></tr>
      </tbody></table></div>
      <div><p class="card-title">Técnica por categoría</p><table><tbody>
        ${TEC_CATS.map(c=>`<tr><td>${c}</td><td class="num">${tc.byCat[c]||0}</td><td class="num">${tc.damaged?((tc.byCat[c]||0)/tc.damaged*100).toFixed(1):"0.0"}%</td></tr>`).join("")}
        <tr class="total-row"><td>Total</td><td class="num">${tc.damaged}</td><td class="num">100%</td></tr>
      </tbody></table></div>
    </div>`;
}
async function renderDashboardView(root){
  const previaAll = await listAllPrevia();
  const daysAll = await listAllTecnicaDays();
  const months = new Set();
  previaAll.forEach(d=>{ if(sumObj(flattenCounts(d.counts))>0) months.add(monthKey(d.date)); });
  daysAll.forEach(d=>{ if((d.columns||[]).some(c=>c.cells.some(x=>x.serial))) months.add(monthKey(d.date)); });
  const monthList = Array.from(months).sort().reverse();
  if(!dashMonth || !monthList.includes(dashMonth)) dashMonth = monthList[0] || monthKey(todayStr());

  root.innerHTML = `
    <div class="page-head">
      <div><h1>Dashboard</h1><p>Se arma solo a partir de lo que registras día a día.</p></div>
      <div class="head-actions"><select id="dash-month">${monthList.length?monthList.map(m=>`<option value="${m}" ${m===dashMonth?"selected":""}>${monthLabel(m)}</option>`).join(""):`<option>${monthLabel(dashMonth)}</option>`}</select></div>
    </div>
    <div id="dash-body"></div>`;
  document.getElementById("dash-month").addEventListener("change",e=>{ dashMonth=e.target.value; dashDay=null; renderDashboardView(root); });

  const body = document.getElementById("dash-body");
  if(monthList.length===0){ body.innerHTML=`<div class="empty-state"><b>Todavía no hay datos</b>Registra al menos un día para ver el dashboard.</div>`; return; }

  const previaMonth = previaAll.filter(d=>monthKey(d.date)===dashMonth);
  const daysMonth = daysAll.filter(d=>monthKey(d.date)===dashMonth);

  const dateSet = new Set();
  previaMonth.forEach(d=>{ if(sumObj(flattenCounts(d.counts))>0) dateSet.add(d.date); });
  daysMonth.forEach(d=>{ if((d.columns||[]).some(c=>c.cells.some(x=>x.serial))) dateSet.add(d.date); });
  const datesSorted = Array.from(dateSet).sort().reverse();
  if(!dashDay || !datesSorted.includes(dashDay)) dashDay = datesSorted[0] || todayStr();

  const dayRows = datesSorted.map(dt=>{
    const pv = aggregatePrevia(previaAll.filter(d=>d.date===dt));
    const tc = aggregateTecnica(daysAll.filter(d=>d.date===dt));
    return {date:dt, previaTotal:pv.total, probed:tc.probed, damaged:tc.damaged, tc};
  });

  body.innerHTML = `
    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px;">
        <p class="card-title" style="margin:0;">Detalle de un día</p>
        <input type="date" id="dash-day-input" value="${dashDay}">
      </div>
      <div id="dash-day-detail"></div>
    </div>
    <div class="card">
      <p class="card-title">Día a día — ${monthLabel(dashMonth)}</p>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Fecha</th><th class="num">Previa (total)</th><th class="num">Probados (técnica)</th><th class="num">Dañados (técnica)</th><th class="num">% rechazo</th></tr></thead>
        <tbody id="dash-day-table"></tbody>
      </table></div>
    </div>
    <div class="divider"></div>
    <p class="card-title" style="margin-bottom:2px;">Resumen general del mes — ${monthLabel(dashMonth)}</p>
    <p class="hint" style="margin-bottom:14px;">Suma todos los días de ${monthLabel(dashMonth)}, no un día en particular.</p>
    <div id="dash-month-summary"></div>
  `;

  document.getElementById("dash-day-input").addEventListener("change", e=>{
    const v = e.target.value; if(!v) return;
    if(monthKey(v) !== dashMonth){ dashMonth = monthKey(v); dashDay = v; renderDashboardView(root); return; }
    dashDay = v; renderDayDetail(dayRows.find(r=>r.date===dashDay) || {date:dashDay, previaTotal:0, probed:0, damaged:0, tc:aggregateTecnica([])}, previaAll);
  });
  const dayTableBody = document.getElementById("dash-day-table");
  dayTableBody.innerHTML = dayRows.map(r=>{
    const pct = r.probed ? (r.damaged/r.probed*100) : 0;
    return `<tr style="cursor:pointer" data-date="${r.date}" class="${r.date===dashDay?'total-row':''}">
      <td class="mono">${r.date}</td><td class="num">${r.previaTotal}</td><td class="num">${r.probed}</td>
      <td class="num" style="font-weight:600; ${r.damaged?'color:var(--wifi)':''}">${r.damaged}</td><td class="num">${pct.toFixed(1)}%</td></tr>`;
  }).join("");
  dayTableBody.querySelectorAll("[data-date]").forEach(tr=>tr.addEventListener("click", ()=>{
    dashDay = tr.dataset.date;
    document.getElementById("dash-day-input").value = dashDay;
    renderDayDetail(dayRows.find(r=>r.date===dashDay), previaAll);
    dayTableBody.querySelectorAll("tr").forEach(x=>x.classList.remove("total-row"));
    tr.classList.add("total-row");
  }));
  renderDayDetail(dayRows.find(r=>r.date===dashDay) || {date:dashDay, previaTotal:0, probed:0, damaged:0, tc:aggregateTecnica([])}, previaAll);

  const {byCat:previaByCat, byModel:previaByModel, total:previaTotal} = aggregatePrevia(previaMonth);
  const {byCat:tecByCat, byModel:tecByModel, total:tecTotal, probed:tecTotalSlots, damaged:tecDamagedSlots} = aggregateTecnica(daysMonth);
  const rechazoPct = tecTotalSlots ? (tecDamagedSlots/tecTotalSlots*100) : 0;
  const tecCats = TEC_CATS;

  const summaryEl = document.getElementById("dash-month-summary");
  summaryEl.innerHTML = `
    <div class="kpi-row">
      <div class="kpi"><div class="val mono">${previaTotal.toLocaleString()}</div><div class="lbl">Daños fase previa</div></div>
      <div class="kpi"><div class="val mono">${tecTotalSlots.toLocaleString()}</div><div class="lbl">Equipos probados (técnica)</div></div>
      <div class="kpi"><div class="val mono">${tecDamagedSlots.toLocaleString()}</div><div class="lbl">Rechazados en técnica</div><div class="sub">${rechazoPct.toFixed(1)}% de lo probado</div></div>
      <div class="kpi"><div class="val mono">${previaMonth.length}</div><div class="lbl">Días con registro previa</div></div>
    </div>
    <div class="chart-grid">
      <div class="card"><p class="card-title">Daños previa por categoría</p><div class="chart-box"><canvas id="c-previa-cat"></canvas></div></div>
      <div class="card"><p class="card-title">Distribución % previa</p><div class="chart-box small"><canvas id="c-previa-pie"></canvas></div></div>
    </div>
    <div class="chart-grid">
      <div class="card"><p class="card-title">Rechazos técnica por categoría</p><div class="chart-box"><canvas id="c-tec-cat"></canvas></div></div>
      <div class="card"><p class="card-title">Distribución % técnica</p><div class="chart-box small"><canvas id="c-tec-pie"></canvas></div></div>
    </div>
    <div class="card"><p class="card-title">Previa por modelo</p><div style="overflow-x:auto;">
      <table><thead><tr><th>Modelo</th>${PREVIA_CATS.map(c=>`<th class="num">${c}</th>`).join("")}<th class="num">Total</th><th class="num">%</th></tr></thead><tbody>
        ${MODELS.map(m=>{ const row=previaByModel[m.code]; if(!row) return ""; const tot=sumObj(row);
          return `<tr><td class="mono">${m.code}</td>${PREVIA_CATS.map(c=>`<td class="num">${row[c]||0}</td>`).join("")}<td class="num" style="font-weight:600">${tot}</td><td class="num">${previaTotal?((tot/previaTotal*100).toFixed(1)):"0.0"}%</td></tr>`; }).join("")}
        <tr class="total-row"><td>TOTAL</td>${PREVIA_CATS.map(c=>`<td class="num">${previaByCat[c]}</td>`).join("")}<td class="num">${previaTotal}</td><td class="num">100%</td></tr>
      </tbody></table></div></div>
    <div class="card"><p class="card-title">Técnica por modelo</p><div style="overflow-x:auto;">
      <table><thead><tr><th>Modelo</th>${tecCats.map(c=>`<th class="num">${stLabel(c)}</th>`).join("")}<th class="num">Total</th><th class="num">%</th></tr></thead><tbody>
        ${MODELS.map(m=>{ const row=tecByModel[m.code]; if(!row) return ""; const tot=sumObj(row);
          return `<tr><td class="mono">${m.code}</td>${tecCats.map(c=>`<td class="num">${row[c]||0}</td>`).join("")}<td class="num" style="font-weight:600">${tot}</td><td class="num">${tecTotal?((tot/tecTotal*100).toFixed(1)):"0.0"}%</td></tr>`; }).join("")}
        <tr class="total-row"><td>TOTAL</td>${tecCats.map(c=>`<td class="num">${tecByCat[c]}</td>`).join("")}<td class="num">${tecTotal}</td><td class="num">100%</td></tr>
      </tbody></table></div></div>
  `;

  chartRefs.forEach(c=>c.destroy()); chartRefs=[];
  const gridColor="rgba(154,165,177,.15)";
  Chart.defaults.color="#9AA5B1"; Chart.defaults.font.family="IBM Plex Mono"; Chart.defaults.borderColor=gridColor;
  const PREVIA_COLORS = ["#F0402B","#FF7A1A","#4F8EF7","#FFC93C","#8B5CF6"];
  chartRefs.push(new Chart(document.getElementById("c-previa-cat"),{type:"bar",data:{labels:PREVIA_CATS,datasets:[{label:"Cantidad",data:PREVIA_CATS.map(c=>previaByCat[c]),backgroundColor:PREVIA_COLORS,borderRadius:5}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:gridColor}},x:{grid:{display:false}}}}}));
  chartRefs.push(new Chart(document.getElementById("c-previa-pie"),{type:"doughnut",data:{labels:PREVIA_CATS,datasets:[{data:PREVIA_CATS.map(c=>previaByCat[c]),backgroundColor:PREVIA_COLORS}]},options:{plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:11}}}}}}));
  chartRefs.push(new Chart(document.getElementById("c-tec-cat"),{type:"bar",data:{labels:tecCats.map(stLabel),datasets:[{label:"Cantidad",data:tecCats.map(c=>tecByCat[c]),backgroundColor:tecCats.map(c=>({PON:"#30A46C",WIFI:"#E5484D",LAN:"#F1A10D","DAÑADO":"#22C3E6"}[c])),borderRadius:5}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:gridColor}},x:{grid:{display:false}}}}}));
  chartRefs.push(new Chart(document.getElementById("c-tec-pie"),{type:"doughnut",data:{labels:tecCats.map(stLabel),datasets:[{data:tecCats.map(c=>tecByCat[c]),backgroundColor:tecCats.map(c=>({PON:"#30A46C",WIFI:"#E5484D",LAN:"#F1A10D","DAÑADO":"#22C3E6"}[c]))}]},options:{plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:11}}}}}}));
}
function flattenCounts(counts){ const out={}; Object.values(counts||{}).forEach(row=>Object.entries(row).forEach(([k,v])=>out[k]=(out[k]||0)+v)); return out; }

/* ===================== VIEW: EXPORTAR ===================== */
async function renderExportarView(root){
  const previaAll = await listAllPrevia();
  const daysAll = await listAllTecnicaDays();
  const months = new Set();
  previaAll.forEach(d=>months.add(monthKey(d.date)));
  daysAll.forEach(d=>months.add(monthKey(d.date)));
  const monthList = Array.from(months).sort().reverse();
  root.innerHTML = `
    <div class="page-head"><div><h1>Exportar a Excel</h1><p>Genera un .xlsx con el resumen del mes y el listado de series de la fase técnica, con el estado de cada una, listo para validar con tu jefe.</p></div></div>
    <div class="card">
      <div class="field" style="max-width:260px;"><label>Mes a exportar</label>
        <select id="export-month"><option value="__all__">Todo el histórico</option>${monthList.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join("")}</select>
      </div>
      <button class="btn primary" id="export-btn">Descargar Excel</button>
      <p class="hint" style="margin-top:10px;">Incluye 3 hojas: Resumen previa, Series técnica (con estado) y Resumen dashboard con porcentajes.</p>
    </div>`;
  document.getElementById("export-btn").addEventListener("click", async ()=>{
    const sel = document.getElementById("export-month").value;
    await doExport(sel==="__all__"?null:sel, previaAll, daysAll);
  });
}
async function doExport(monthK, previaAll, daysAll){
  const previaRows=[];
  previaAll.filter(d=>!monthK||monthKey(d.date)===monthK).forEach(d=>{
    Object.entries(d.counts||{}).forEach(([model,row])=>{
      const m=MODEL_MAP[model];
      Object.entries(row).forEach(([cat,qty])=>previaRows.push({Fecha:d.date,Marca:m?m.brand:"",Modelo:model,Categoria:cat,Cantidad:qty}));
    });
  });
  const tecCats=["PON","WIFI","LAN","DAÑADO"]; const tecByCat={}; tecCats.forEach(c=>tecByCat[c]=0);
  const tecRows=[];
  daysAll.filter(d=>!monthK||monthKey(d.date)===monthK).forEach(day=>{
    (day.columns||[]).forEach(col=>col.cells.forEach(cell=>{
      if(!cell.serial) return;
      const m=MODEL_MAP[col.modelo];
      tecRows.push({Fecha:day.date,Tanda:col.seq,Posicion:cell.pos,Serie:cell.serial,Marca:m?m.brand:"",Modelo:col.modelo||"",Estado:(STATE_EMOJI[cell.estado]||"")+" "+stLabel(cell.estado)});
      if(cell.estado && tecByCat[cell.estado]!==undefined) tecByCat[cell.estado]++;
    }));
  });
  const previaByCat={}; PREVIA_CATS.forEach(c=>previaByCat[c]=0);
  previaRows.forEach(r=>previaByCat[r.Categoria]=(previaByCat[r.Categoria]||0)+r.Cantidad);
  const previaTotal = Object.values(previaByCat).reduce((a,b)=>a+b,0);
  const tecTotal = Object.values(tecByCat).reduce((a,b)=>a+b,0);
  const summaryRows=[
    {"Sección":"Fase previa", ...previaByCat, Total:previaTotal},
    {"Sección":"Fase técnica", PON:tecByCat.PON, WIFI:tecByCat.WIFI, LAN:tecByCat.LAN, [stLabel("DAÑADO")]:tecByCat["DAÑADO"], Total:tecTotal},
  ];
  const pctRows=[
    {"Sección":"% Fase previa", ...Object.fromEntries(PREVIA_CATS.map(c=>[c, previaTotal?(previaByCat[c]/previaTotal*100).toFixed(1)+"%":"0%"]))},
    {"Sección":"% Fase técnica", ...Object.fromEntries(tecCats.map(c=>[stLabel(c), tecTotal?(tecByCat[c]/tecTotal*100).toFixed(1)+"%":"0%"]))},
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(previaRows.length?previaRows:[{Fecha:"",Marca:"",Modelo:"",Categoria:"",Cantidad:""}]), "Resumen previa");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tecRows.length?tecRows:[{Fecha:"",Tanda:"",Posicion:"",Serie:"",Marca:"",Modelo:"",Estado:""}]), "Series tecnica");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([...summaryRows,{},...pctRows]), "Resumen dashboard");
  const wbout = XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const blob = new Blob([wbout],{type:"application/octet-stream"});
  const filename = "control_ont_"+(monthK||"historico")+".xlsx";
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },1000);
  toast("Archivo descargado");
}
